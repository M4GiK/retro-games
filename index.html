*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;image-rendering:pixelated}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse at 50% 70%,#1c1233 0%,#0a0a18 55%,#04040a 100%);
  font-family:'Press Start 2P','Courier New',monospace;color:#f4f4f4;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
/* subtelny dither tła — jak maski .screen.ghost w grze */
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.015) 0% 25%,transparent 0% 50%);
  background-size:4px 4px}

/* ---- Ekran kineskopu: collapse/expand jak splash gry ---- */
#tv{position:fixed;inset:0;transform-origin:center;will-change:transform,filter}
#tv.shut{animation:tvOff .42s cubic-bezier(.7,0,.9,.4) forwards}
#tv.open{animation:tvOn .5s cubic-bezier(.2,.6,.3,1) both}
@keyframes tvOff{
  0%{transform:scale(1,1);filter:brightness(1)}
  55%{transform:scale(1.04,.010);filter:brightness(2.8)}
  78%{transform:scale(1,.006);filter:brightness(4)}
  100%{transform:scale(.15,.004);filter:brightness(0)}
}
@keyframes tvOn{
  0%{transform:scale(.35,.006);filter:brightness(5)}
  40%{transform:scale(1,.012);filter:brightness(3.2)}
  100%{transform:scale(1,1);filter:brightness(1)}
}

/* ---- Półka (launcher) ---- */
#shelf{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#shelf[hidden],#player[hidden]{display:none}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px 0}
.brand{font-size:clamp(12px,2.6vw,18px);color:#fcfcfc;letter-spacing:3px;text-shadow:3px 3px 0 #ff0055;
  text-decoration:none;display:inline-block}
.brand b{color:#ffcc00;font-weight:400}
.brand small{display:block;font-size:.45em;color:#00e5ff;letter-spacing:7px;margin-top:8px;text-shadow:none}
.status{display:flex;align-items:center;gap:16px;font-size:9px;color:#7fa0c8}
#muteBtn{border:2px solid #000;background:#00e5ff;color:#000;font-family:inherit;font-size:8px;
  padding:6px 8px;cursor:pointer;box-shadow:3px 3px 0 rgba(252,252,252,.7)}
#muteBtn:active{transform:translate(3px,3px);box-shadow:none}
.batt{width:24px;height:12px;border:2px solid #fcfcfc;position:relative;padding:1px;flex:none}
.batt::before{content:'';position:absolute;right:-5px;top:2px;width:3px;height:4px;background:#fcfcfc}
.batt i{display:block;height:100%;width:72%;background:#00e5ff}

main{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:36px;
  align-items:center;padding:8px 40px;min-height:0}

/* Pasek okładek — jak rząd gier na Switchu */
#rail{display:flex;align-items:center;overflow-x:auto;overflow-y:visible;min-height:0;
  scrollbar-width:none;-ms-overflow-style:none}
#rail::-webkit-scrollbar{display:none}
#railInner{margin:auto;display:flex;align-items:center;gap:48px;padding:34px 8px}
.cart{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:none;border:0;padding:0;cursor:pointer;font-family:inherit;
  transition:transform .18s steps(4),filter .18s}
.cart img,.cart .q{
  width:min(34dvh,26dvw,320px);min-width:150px;aspect-ratio:901/1024;object-fit:cover;display:block;
  border:3px solid #2a2a44;box-shadow:6px 6px 0 rgba(0,0,0,.55);
  filter:brightness(.55) saturate(.7);transition:filter .18s,box-shadow .18s,border-color .18s}
.cart .q{display:flex;align-items:center;justify-content:center;font-size:clamp(60px,11dvh,120px);color:#3a3a5c;
  background:repeating-conic-gradient(#12121f 0% 25%,#0b0b14 0% 50%);background-size:8px 8px;
  border-style:dashed}
.cart-label{font-size:9px;color:#7fa0c8;letter-spacing:1px;transition:color .18s;text-transform:uppercase}
.cart.sel{transform:translateY(-10px) scale(1.12)}
.cart.sel img{border-color:#00e5ff;filter:none;
  box-shadow:6px 6px 0 rgba(0,0,0,.55),0 0 0 3px #0a0a18,0 0 30px rgba(0,229,255,.45)}
.cart.sel .cart-label{color:#ffcc00;text-shadow:2px 2px 0 #f83800}
.cart.shake{animation:shake .3s steps(6)}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* Panel opisu obok półki */
#info{position:relative;border:3px solid #fcfcfc;background:rgba(10,10,24,.88);
  box-shadow:8px 8px 0 rgba(0,0,0,.6);padding:24px 24px 20px;min-width:0;text-transform:uppercase}
#info::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(0,0,0,.14) 0% 25%,transparent 0% 50%);background-size:4px 4px}
#info>*{position:relative}
.chip{display:inline-block;font-size:7px;letter-spacing:2px;color:#000;background:#00e5ff;
  padding:5px 8px;margin-bottom:14px;box-shadow:3px 3px 0 #000}
#gTitle{margin:0 0 12px;font-size:clamp(15px,3vw,24px);line-height:1.5;color:#fcfcfc;
  letter-spacing:2px;text-shadow:3px 3px 0 #000}
#gTitle span{color:#ffcc00;text-shadow:3px 3px 0 #f83800}
#gTag{font-size:8px;color:#ffcc00;letter-spacing:1px;line-height:2;margin:0 0 14px}
#gDesc{font-size:9px;line-height:2.1;letter-spacing:1px;color:#c8d4ea;margin:0 0 18px;max-width:44ch}
#meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
#meta span{font-size:7px;color:#7fa0c8;border:2px solid #2a2a44;padding:6px 8px;letter-spacing:1px}
#meta b{color:#fcfcfc;font-weight:400}
#playBtn{width:100%;padding:14px;border:3px solid #000;background:#ffcc00;color:#000;
  font-family:inherit;font-size:11px;letter-spacing:2px;cursor:pointer;box-shadow:5px 5px 0 #fff}
#playBtn:active{transform:translate(5px,5px);box-shadow:0 0 0 #fff}
#playBtn[disabled]{background:#2a2a44;color:#7fa0c8;box-shadow:5px 5px 0 #000;cursor:default;
  transform:none}

footer{padding:0 28px 18px;display:flex;justify-content:space-between;align-items:center;
  font-size:7px;color:#7fa0c8;letter-spacing:2px;text-transform:uppercase}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---- Widok gry (iframe) + przycisk powrotu ---- */
#player{position:absolute;inset:0;background:#000}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#homeBtn{position:absolute;top:10px;left:10px;z-index:8;padding:8px 10px;border:2px solid #000;
  background:rgba(26,28,44,.72);color:#00e5ff;font-family:inherit;font-size:8px;letter-spacing:1px;
  cursor:pointer;box-shadow:3px 3px 0 #000;opacity:.45;transition:opacity .15s}
#homeBtn:hover,#homeBtn:focus-visible{opacity:1}
#homeBtn:active{transform:translate(3px,3px);box-shadow:none}

/* ---- Ekran wkładania kasety — jak #boot w grze ---- */
#loading{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;background:rgba(0,0,0,.94);text-align:center;padding:24px;
  text-transform:uppercase}
#loading[hidden]{display:none}
#loading::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(0,0,0,.25) 0% 25%,transparent 0% 50%);background-size:4px 4px}
#loadLogo{font-size:clamp(16px,4.5vw,26px);color:#fcfcfc;letter-spacing:4px;position:relative;
  animation:bootpop .45s steps(5) both}
#loadLogo span{color:#ffcc00}
.slot{position:relative;width:150px;height:66px}
.slot::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;
  border:3px solid #7fa0c8;border-bottom-width:5px;background:#0a0a14}
.cartchip{position:absolute;left:50%;bottom:14px;width:64px;height:44px;margin-left:-32px;
  background:#2a2a44;border:3px solid #fcfcfc;border-bottom:0;
  animation:cartIn 1.1s steps(8) infinite}
.cartchip::before{content:'';position:absolute;inset:6px 8px auto;height:16px;background:#ffcc00}
.cartchip::after{content:'';position:absolute;left:8px;right:8px;bottom:4px;height:8px;
  background:repeating-linear-gradient(90deg,#f83800 0 6px,transparent 6px 12px)}
@keyframes cartIn{0%{transform:translateY(-56px)}70%,100%{transform:translateY(0)}}
@keyframes bootpop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.boot-bar{width:min(240px,60%);height:16px;border:3px solid #fcfcfc;padding:2px;position:relative}
#loadFill{height:100%;width:0;background:#f83800;transition:width .12s steps(2)}
#loadHint{font-size:8px;color:#7fa0c8;letter-spacing:2px;position:relative;margin:0}

/* ---- CRT overlay — jak drawCrtOverlay w grze, nad wszystkim ---- */
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}
#crt::before{content:'';position:absolute;left:0;right:0;top:-80px;height:80px;
  background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.045),rgba(255,255,255,0));
  animation:crtroll 8s linear infinite}
@keyframes crtroll{to{transform:translateY(calc(100vh + 160px))}}
#crt::after{content:'';position:absolute;inset:0;
  box-shadow:inset 0 0 110px rgba(0,0,0,.6),inset 0 0 10px rgba(0,0,0,.9)}

@media (max-width:840px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:10px;align-items:start;
    overflow-y:auto;padding:0 18px}
  #rail{width:100%}
  #railInner{margin:0 auto;gap:30px}
  .cart img,.cart .q{width:min(26dvh,40dvw,220px)}
  #info{margin-bottom:12px}
  footer{justify-content:center;gap:18px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="tv">
  <section id="shelf">
    <header>
      <a class="brand" href="https://m4gik.github.io/" target="_blank" rel="noopener"
        title="m4gik.github.io">M<b>4</b>GiK<small>SOFTWARE</small></a>
      <div class="status">
        <button id="muteBtn" title="Dźwięk">SND</button>
        <span id="clock">--:--</span>
        <span class="batt"><i></i></span>
      </div>
    </header>
    <main>
      <div id="rail"><div id="railInner"></div></div>
      <aside id="info">
        <span class="chip" id="gChip">KASETA 8-BIT</span>
        <h1 id="gTitle"></h1>
        <p id="gTag"></p>
        <p id="gDesc"></p>
        <div id="meta"></div>
        <button id="playBtn">▶ START</button>
      </aside>
    </main>
    <footer>
      <span>◀ ▶ WYBIERZ</span>
      <span class="blink">ENTER — START</span>
      <span>© 2026 M4GiK SOFTWARE</span>
    </footer>
  </section>

  <section id="player" hidden>
    <button id="homeBtn">◀ MENU</button>
  </section>
</div>

<div id="loading" hidden>
  <div id="loadLogo"></div>
  <div class="slot"><div class="cartchip"></div></div>
  <div class="boot-bar"><div id="loadFill"></div></div>
  <p id="loadHint">WKŁADANIE KASETY...</p>
</div>

<div id="crt"></div>

<script>
'use strict';
// Launcher "konsoli" — półka kaset w stylu Switch, całość w estetyce CRT/NES.
// Nowa gra = wpis w GAMES (okładka w covers/, plik w <gra>/dist/).
const GAMES = [
  {
    id: 'kurkarurka',
    title: 'Kurkarurka',
    logo: ['KURKA', 'RURKA'],
    chip: 'KASETA 8-BIT',
    tag: 'ZBIERAJ JAJKA · SKACZ NAD LISAMI',
    desc: 'Kurka Robcio wyrusza po jajka! Skacz lisom na łby, łap złote jajka ' +
      'za 5× punktów i buduj combo. Power-upy: tarcza, magnes, spowolnienie ' +
      'czasu i dodatkowy skok. Co 4 poziomy arena — walka z wielkim wilkiem. ' +
      'Dwa tryby: PRZYGODA i KOSZMAR. Ranking top 5 zapisuje się w konsoli.',
    cover: 'covers/kurkarurka.jpg',
    url: 'kurkarurka/dist/kurnik-physics.html',
    meta: [['ROK', '2026'], ['GATUNEK', 'ZRĘCZNOŚCIOWA'], ['GRACZE', '1']],
  },
  {
    id: 'jetman',
    title: 'Jetman Online',
    logo: ['JETMAN', 'ONLINE'],
    chip: 'KASETA ONLINE',
    tag: 'POJEDYNEK NA JETPACKACH · POKOJE NA KOD',
    desc: 'Klon Jetmen Revival w sieci: 2–4 graczy, jedna arena na ' +
      'ekranie — koniec z podglądaniem split-screenu. Zabierz flagę ' +
      'wroga do własnej bazy (5 pkt) albo zestrzel przeciwnika (1 pkt). ' +
      'WebRTC — zero serwera, wystarczy kod pokoju.',
    cover: 'covers/jetman.jpg',
    url: 'jetman-online/dist/jetman.html',
    meta: [['ROK', '2026'], ['GATUNEK', 'SIECIOWA'], ['GRACZE', '2–4 ONLINE']],
  },
  {
    id: 'soon', soon: true, title: '???', chip: 'KASETA',
    tag: 'NASTĘPNA PRODUKCJA', desc: 'M4GiK Software składa kolejną kasetę. Wkrótce.',
    meta: [['ROK', '—'], ['GATUNEK', '???'], ['GRACZE', '—']],
  },
];

const $ = s => document.querySelector(s);
const tv = $('#tv'), shelf = $('#shelf'), player = $('#player'),
  railInner = $('#railInner'), loading = $('#loading'),
  loadLogo = $('#loadLogo'), loadFill = $('#loadFill'), loadHint = $('#loadHint'),
  playBtn = $('#playBtn'), homeBtn = $('#homeBtn');

let sel = 0;
let mode = 'shelf'; // shelf | anim | play

// ---- Mini audio (te same kanały co w grze: square/saw/noise) ----
let ac = null, muted = false;
function actx() {
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; ac = new A(); }
  if (ac.state === 'suspended') void ac.resume();
  return ac;
}
function tone(f, type, dur, at = 0, vol = 0.08, slide) {
  if (muted) return;
  try {
    const c = actx(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide != null) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* audio zablokowane */ }
}
const sMove = () => tone(700, 'square', 0.05, 0, 0.05);
const sBuzz = () => { tone(130, 'square', 0.14, 0, 0.09); tone(130, 'square', 0.14, 0.17, 0.09); };
const sCoin = () => {
  tone(988, 'square', 0.06, 0, 0.08); tone(1319, 'square', 0.12, 0.06, 0.08);
  tone(280, 'sawtooth', 0.32, 0.22, 0.05, 900);
};
const sOff = () => tone(520, 'square', 0.3, 0, 0.08, 60);
const sOn = () => { tone(55, 'sawtooth', 0.35, 0, 0.06, 220); tone(1200, 'square', 0.06, 0.32, 0.05); };

// ---- Półka kaset ----
function buildRail() {
  railInner.innerHTML = '';
  GAMES.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'cart' + (g.soon ? ' soon' : '') + (i === sel ? ' sel' : '');
    b.innerHTML = g.soon
      ? '<span class="q">?</span><span class="cart-label">???</span>'
      : `<img src="${g.cover}" alt="${g.title}" draggable="false"><span class="cart-label">${g.title.toUpperCase()}</span>`;
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (mode !== 'shelf') return;
      if (i === sel) launch(GAMES[i]); else select(i);
    });
    b.addEventListener('mouseenter', () => { if (mode === 'shelf' && sel !== i) select(i); });
    railInner.appendChild(b);
  });
}

function select(i, silent) {
  sel = (i + GAMES.length) % GAMES.length;
  if (!silent) sMove();
  [...railInner.children].forEach((c, j) => c.classList.toggle('sel', j === sel));
  const el = railInner.children[sel];
  if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  updatePanel();
}

function updatePanel() {
  const g = GAMES[sel];
  $('#gChip').textContent = g.chip || 'KASETA 8-BIT';
  $('#gTitle').innerHTML = g.logo
    ? `${g.logo[0]}<span>${g.logo[1] || ''}</span>`
    : g.title.toUpperCase();
  $('#gTag').textContent = g.tag || '';
  $('#gDesc').textContent = g.desc || '';
  $('#meta').innerHTML = (g.meta || [])
    .map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('');
  playBtn.disabled = !!g.soon;
  playBtn.textContent = g.soon ? 'WKRÓTCE' : '▶ START';
}

// ---- Przejścia CRT: obraz zapada się do linii / rozkłada z linii ----
function onceAnim(el, fn) {
  let done = false;
  const fin = () => { if (done) return; done = true; clearTimeout(to); el.removeEventListener('animationend', h); fn(); };
  const h = e => { if (e.target === el) fin(); };
  const to = setTimeout(fin, 700); // fallback, gdyby animationend nie strzeliło
  el.addEventListener('animationend', h);
}
function shut(cb) { tv.classList.add('shut'); onceAnim(tv, cb); }
function open(cb) {
  tv.classList.remove('shut'); tv.classList.add('open');
  onceAnim(tv, () => { tv.classList.remove('open'); cb(); });
}

// ---- Uruchamianie gry ----
function launch(g) {
  if (mode !== 'shelf') return;
  if (g.soon) {
    sBuzz();
    const t = railInner.children[sel];
    t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
    return;
  }
  mode = 'anim';
  sCoin();
  try { history.pushState({ g: g.id }, '', '?game=' + g.id); } catch (e) {}

  shut(() => {
    shelf.hidden = true;
    player.hidden = false;
    bootCart(g);
  });
}

function bootCart(g) {
  loadLogo.innerHTML = g.logo
    ? `${g.logo[0]}<span>${g.logo[1] || ''}</span>` : g.title.toUpperCase();
  loadHint.textContent = 'WKŁADANIE KASETY...';
  loadFill.style.width = '0';
  loading.hidden = false;

  const frame = document.createElement('iframe');
  frame.id = 'gameFrame';
  frame.setAttribute('allow', 'autoplay; gamepad');
  frame.src = g.url;
  player.appendChild(frame);

  const t0 = performance.now();
  let loaded = false;
  frame.addEventListener('load', () => { loaded = true; });
  setTimeout(() => { loaded = true; }, 8000); // awaryjnie — nie blokuj

  let p = 0;
  const iv = setInterval(() => {
    p = Math.min(p + 7, loaded ? 100 : 74);
    loadFill.style.width = p + '%';
    if (loaded && p >= 100) {
      clearInterval(iv);
      loadHint.textContent = 'START!';
      const wait = Math.max(0, 1400 - (performance.now() - t0));
      setTimeout(() => {
        loading.hidden = true;
        sOn();
        open(() => {
          mode = 'play';
          try { frame.contentWindow.focus(); } catch (e) {}
        });
      }, wait + 240);
    }
  }, 110);
}

function goHome() {
  if (mode !== 'play') return;
  mode = 'anim';
  sOff();
  try { history.replaceState({}, '', location.pathname); } catch (e) {}
  shut(() => {
    const f = $('#gameFrame');
    if (f) { f.src = 'about:blank'; f.remove(); }
    player.hidden = true;
    shelf.hidden = false;
    open(() => { mode = 'shelf'; });
  });
}

// ---- Input ----
window.addEventListener('keydown', e => {
  actx(); // pierwszy gest odblokowuje dźwięk
  if (mode === 'play') { if (e.key === 'Escape') goHome(); return; }
  if (mode !== 'shelf') return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') select(sel - 1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') select(sel + 1);
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); launch(GAMES[sel]); }
});
window.addEventListener('pointerdown', () => actx(), { once: true });
window.addEventListener('popstate', () => { if (mode === 'play') goHome(); });

playBtn.addEventListener('click', () => launch(GAMES[sel]));
homeBtn.addEventListener('click', goHome);
$('#muteBtn').addEventListener('click', e => {
  muted = !muted;
  e.target.textContent = muted ? 'OFF' : 'SND';
  e.target.style.background = muted ? '#2a2a44' : '#00e5ff';
  e.target.style.color = muted ? '#7fa0c8' : '#000';
});

// ---- Zegar jak w pasku statusu konsoli ----
function tick() {
  const d = new Date();
  $('#clock').textContent =
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
setInterval(tick, 5000); tick();

// ---- Start: półka albo deep-link ?game=<id> ----
buildRail();
select(0, true);
const wanted = new URLSearchParams(location.search).get('game');
if (wanted) {
  const i = GAMES.findIndex(g => g.id === wanted && !g.soon);
  if (i >= 0) { select(i, true); launch(GAMES[i]); }
}
</script>
</body>
</html>
