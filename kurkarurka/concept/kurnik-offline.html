<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Robot i Kurnik</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#f4f8ff;font-family:system-ui,sans-serif;overscroll-behavior:none}
header{display:flex;gap:10px;justify-content:space-between;padding:10px;background:#fff;border-bottom:1px solid #e5effa;position:sticky;top:0;z-index:10}
.pill{padding:6px 10px;border-radius:999px;background:#eef5ff;border:1px solid #dbe9ff;min-width:80px;text-align:center}
label{color:#5b6f8a;font-size:12px;display:block}
#stage{position:relative;width:100%;max-width:900px;height:60vh;min-height:340px;margin:0 auto;background:linear-gradient(#bfd7fe,#e8f3ff);border:2px solid #cfe1ff;overflow:hidden;touch-action:none}
#player{position:absolute;left:50px;top:50%;width:40px;height:40px;background:#ffd966;border:2px solid #d7a43f;border-radius:50%;box-shadow:0 4px 0 #b8842e}
#player::after{content:"🐔";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.egg{position:absolute;width:22px;height:26px;background:#fff;border:2px solid #d3cbb8;border-radius:50%;box-shadow:inset -3px -3px 0 #ece6d7}
.egg.yellow{background:#fff5cc;border-color:#d9c86a}
.enemy{position:absolute;width:50px;height:50px;background:#ff7f7f;border:2px solid #c44;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px}
.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.85);padding:6px 10px;border-radius:10px;z-index:3}
#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:10px;border:1px solid #cfe1ff;background:#fff;cursor:pointer;z-index:3}
footer{text-align:center;padding:12px;color:#5b6f8a;font-size:13px}
#mute{position:absolute;top:10px;right:10px;z-index:4;padding:8px 10px;border-radius:10px;border:1px solid #cfe1ff;background:#fff}
#mobileControls{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px env(safe-area-inset-right) calc(12px + env(safe-area-inset-bottom)) env(safe-area-inset-left);background:rgba(255,255,255,.95);border-top:1px solid #dbe9ff;z-index:20;position:fixed;left:0;right:0;bottom:0}
#mobileControls button{user-select:none;-webkit-user-select:none;touch-action:manipulation;width:min(18vw,64px);height:min(18vw,64px);font-size:22px;border-radius:14px;border:1px solid #cfe1ff;background:#fff}
#mPause{font-size:18px}
.tint{position:absolute;inset:0;background:rgba(0,0,0,.25);display:none;z-index:2;align-items:center;justify-content:center;color:#fff;font-size:20px;border-radius:12px;padding:10px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="pill"><label>Szybkość</label><div id="speedText">Średnia</div></div>
  <div class="pill"><label>Wynik</label><div id="score">0</div></div>
  <div class="pill"><label>Przetrwanie</label><div id="lives">❤❤❤</div></div>
  <div class="pill"><label>Jajka</label><div id="collected">0</div></div>
</header>
<div id="stage">
  <div class="hud">Zbieraj jajka 🥚, omijaj lisy 🦊</div>
  <div id="player"></div>
  <button id="start">▶️ Start</button>
  <button id="mute">🔊</button>
  <audio id="bgMusic" loop preload="auto">
    <source src="https://cdn1.suno.ai/05bcf50a-9f61-4cfa-bdaa-313f2800f382.mp3" type="audio/mpeg"/>
  </audio>
  <div id="pauseTint" class="tint">Pauza — dotknij ⏸</div>
</div>
<footer>
  Klawiatura: W/A/S/D / strzałki · Pauza: P<br/>
  Telefon: ← ↑ ↓ → oraz ⏸
</footer>
<div id="mobileControls">
  <button id="mLeft">←</button>
  <button id="mUp">↑</button>
  <button id="mDown">↓</button>
  <button id="mRight">→</button>
  <button id="mPause">⏸</button>
</div>
<script>
const stage=document.getElementById('stage');
const player=document.getElementById('player');
const startBtn=document.getElementById('start');

const state={
  running:false,
  collected:0,
  lives:3,
  score:0,
  keys:new Set(),
  eggs:[],
  enemies:[],
  lastSpawn:0,
  animationId:null
};

function updateHUD(){
  document.getElementById('score').textContent=state.score;
  document.getElementById('lives').textContent='❤'.repeat(Math.max(0,state.lives));
  document.getElementById('collected').textContent=state.collected;
}

function spawnEgg(){
  const egg=document.createElement('div');
  egg.className='egg '+(Math.random()<0.3?'yellow':'');
  const stageH=stage.clientHeight-90;
  const maxLeft=Math.max(0,stage.clientWidth-50);
  const left=60+Math.random()*(maxLeft-60);
  const top=60+Math.random()*stageH;
  egg.style.left=left+'px';
  egg.style.top=top+'px';
  stage.appendChild(egg);
  state.eggs.push({el:egg,x:left,y:top,dy:0.4+Math.random()});
}

function spawnEnemy(){
  const enemy=document.createElement('div');
  enemy.className='enemy';
  enemy.textContent='🦊';
  const stageH=stage.clientHeight-100;
  const top=70+Math.random()*stageH;
  enemy.style.left='10px';
  enemy.style.top=top+'px';
  stage.appendChild(enemy);
  state.enemies.push({el:enemy,x:-60,y:top,dx:1.8+Math.random()});
}

function startGame(){
  if(state.running)return;
  state.running=true;
  state.collected=0;
  state.lives=3;
  state.score=0;
  state.enemies.forEach(e=>e.el.remove());
  state.eggs.forEach(e=>e.el.remove());
  state.enemies=[];
  state.eggs=[];
  state.lastSpawn=performance.now();
  startBtn.textContent='⏹️ Stop';
  updateHUD();
}

function stopGame(){
  state.running=false;
  startBtn.textContent='▶️ Znowu';
}

startBtn.addEventListener('click',()=>{ if(state.running)stopGame(); else startGame(); });

window.addEventListener('keydown',e=>state.keys.add(e.key.toLowerCase()));
window.addEventListener('keyup',e=>state.keys.delete(e.key.toLowerCase()));

function loop(now){
  state.animationId=requestAnimationFrame(loop);
  if(!state.running)return;
  const stageH=stage.clientHeight-90;

  if((state.keys.has('w')||state.keys.has('arrowup'))&& player.offsetTop>60) player.style.top=(player.offsetTop-3)+'px';
  if((state.keys.has('s')||state.keys.has('arrowdown'))&& player.offsetTop<stageH) player.style.top=(player.offsetTop+3)+'px';
  if(state.keys.has('a')&&player.offsetLeft>20) player.style.left=(player.offsetLeft-2.5)+'px';
  if(state.keys.has('d')&&player.offsetLeft<stage.clientWidth-70) player.style.left=(player.offsetLeft+2.5)+'px';

  if(now-state.lastSpawn>800&&state.eggs.length<8){spawnEgg();state.lastSpawn=now;}
  if(now%1600<17)spawnEnemy();

  state.eggs=state.eggs.filter(o=>{
    o.y+=o.dy;o.el.style.top=o.y+'px';
    const hit=Math.abs(o.x-player.offsetLeft)<34&&Math.abs(o.y-player.offsetTop)<40;
    if(hit){o.el.remove();state.collected+=1;state.score+=10;updateHUD();return false;}
    if(o.y>stageH+30){o.el.remove();return false;}
    return true;
  });

  state.enemies=state.enemies.filter(o=>{
    o.x+=o.dx;o.el.style.left=o.x+'px';
    const hit=Math.abs(o.x+25-(player.offsetLeft+20))<32&&Math.abs(o.y-player.offsetTop)<40;
    if(hit){o.el.remove();state.lives-=1;updateHUD();if(state.lives<=0)stopGame();return false;}
    if(o.x>stage.clientWidth+90){o.el.remove();return false;}
    return true;
  });
}

state.animationId=requestAnimationFrame(loop);

(function(){
  const music=document.getElementById('bgMusic');
  let muted=false;
  const tryPlay=async()=>{ try{await music.play();}catch{} };
  startBtn.addEventListener('click',()=>tryPlay());

  const muteBtn=document.getElementById('mute');
  if(muteBtn){
    muteBtn.addEventListener('click',async()=>{
      muted=!muted;
      music.muted=muted;
      muteBtn.textContent=muted?'🔇':'🔊';
      if(!muted)await tryPlay();
    });
  }

  const pauseTint=document.getElementById('pauseTint');
  const map={mUp:'arrowup',mDown:'arrowdown',mLeft:'a',mRight:'d'};
  const press=(id,on)=>on?state.keys.add(map[id]):state.keys.delete(map[id]);
  Object.entries(map).forEach(([id])=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('pointerdown',e=>{e.preventDefault();press(id,true);});
    el.addEventListener('pointerup',e=>{e.preventDefault();press(id,false);});
    el.addEventListener('pointerleave',e=>press(id,false));
    el.addEventListener('pointercancel',e=>press(id,false));
  });

  const mp=document.getElementById('mPause');
  if(mp){
    mp.addEventListener('click',e=>{
      e.preventDefault();
      if(state.running){stopGame();}else{startGame();pauseTint.style.display='none';}
      pauseTint.style.display=state.running?'none':'flex';
    });
  }

  stopGame = state.running ? (()=>{ state.running=false; startBtn.textContent='▶️ Znowu'; pauseTint.style.display='flex'; }) : (()=>{ state.running=false; startBtn.textContent='▶️ Znowu'; pauseTint.style.display='none'; });
})();
</script>
</body>
</html>
