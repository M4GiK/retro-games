<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kurnik</title><style>*{box-sizing:border-box;margin:0}html,body{height:100%;background:#f4f8ff;font-family:system-ui,sans-serif}header{display:flex;justify-content:space-between;padding:10px;background:#fff;border-bottom:1px solid #e5effa;position:sticky;top:0;z-index:5}header div{padding:6px 8px;border-radius:8px;background:#eef5ff;border:1px solid #dbe9ff}#stage{position:relative;width:100%;height:65vh;background:linear-gradient(#bfd7fe,#e8f3ff);overflow:hidden;border:2px solid #cfe1ff}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #cfe1ff;padding:10px 16px;border-radius:10px;z-index:4}.mobile{position:fixed;bottom:0;left:0;right:0;padding:8px;background:#fff;border-top:1px solid #dbe9ff;z-index:10;display:flex;justify-content:space-between;gap:12px}.btn{flex:1;height:56px;border-radius:14px;border:1px solid #cfe1ff;background:#fff;font-size:22px}footer{padding:10px;color:#4b5e76}</style></head><body><header><div>Wynik: <b id="score">0</b></div><div>Życie: <b id="lives">❤❤❤</b></div></header><div id="stage"><canvas id="cv"></canvas><button class="overlay" id="start">▶ Start</button></div><div class="mobile" id="mob"><button class="btn" id="left">←</button><button class="btn" id="mid">⤒</button><button class="btn" id="right">→</button></div><footer>Mobilnie: lewy/prawy sektor — bok, środek — góra/dół. Na PC strzałki.</footer><audio id="music" loop preload="auto"><source src="https://cdn1.suno.ai/05bcf50a-9f61-4cfa-bdaa-313f2800f382.mp3" type="audio/mpeg"></audio><script>const stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),start=document.getElementById('start'),scores=document.getElementById('score'),lives=document.getElementById('lives'),music=document.getElementById('music');function resize(){cv.width=stage.clientWidth;cv.height=stage.clientHeight}resize();addEventListener('resize',resize);let W=cv.width,H=cv.height;const state={run:false,muted:false,score:0,lives:3,keys:new Set(),touch:{left:false,mid:false,right:false}};function updateHUD(){scores.textContent=state.score;lives.textContent='❤'.repeat(Math.max(0,state.lives))}function spawn(obj){return{x:Math.random()*W,y:obj.y0,dy:obj.dy0,dx:obj.dx0||0,r:obj.r,col:obj.col}}function reset(){state.run=true;state.score=0;state.lives=3;player.x=W/2;player.y=H-60;player.vx=0;player.vy=0;player.r=18;eggs=[];enemies=[];enemies.push(spawn({y0:40,r:20,dy0:0,col:'#ff7f7f'}));updateHUD();start.textContent='⏹ Stop'}let player={x:W/2,y:H-60,vx:0,vy:0,r:18,col:'#ffd966'};let eggs=[],enemies=[];function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#bfd7fe';ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.moveTo(W/2-14,player.y-18);ctx.lineTo(W/2+14,player.y-18);ctx.lineTo(W/2+12,player.y+18);ctx.lineTo(W/2-12,player.y+18);ctx.closePath();ctx.fillStyle=player.col;ctx.fill();ctx.strokeStyle='#b8842e';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(W/2,player.y-8,8,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#b8842e';ctx.stroke();drawEggs();drawEnemies()}function drawEggs(){for(let i=0;i<eggs.length;i++){const e=eggs[i];ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle=e.col;ctx.fill();ctx.strokeStyle='#b8842e';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(e.x-2,e.y-2,e.r*.22,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}}function drawEnemies(){for(let i=0;i<enemies.length;i++){const e=enemies[i];ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle=e.col;ctx.fill();ctx.strokeStyle='#8b0000';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2;ctx.stroke()}}function col(o1,o2){const dx=o1.x-o2.x,dy=o1.y-o2.y;const r=o1.r+o2.r;return Math.abs(dx)<r && Math.abs(dy)<r}function update(){if(!state.run)return;const speed=4;if(state.keys.has('ArrowLeft')||state.touch.left)player.x-=speed;if(state.keys.has('ArrowRight')||state.touch.right)player.x+=speed;if(state.keys.has('ArrowUp')||state.touch.mid)player.y-=speed;if(state.keys.has('ArrowDown')||state.touch.mid)player.y+=speed;player.x=Math.max(20,Math.min(W-20,player.x));player.y=Math.max(20,Math.min(H-20,player.y));for(let i=0;i<eggs.length;i++){const e=eggs[i];e.y+=e.dy;e.x+=e.dx;if(col(player,e)){state.score+=10;state.touch&&state.touch.mid&&state.touch.left&&(state.score+=2);updateHUD();eggs.splice(i,1);i--;continue}if(e.y>H+30){eggs.splice(i,1);i--}}if(Math.random()<0.02)eggs.push(spawn({y0:40,r:10,dy0:1.2+Math.random()*1.6,dx0:(Math.random()-0.5)*.8,col:'#fff5cc'}));for(let i=0;i<enemies.length;i++){const e=enemies[i];e.y+=e.dy;e.x+=e.dx;if(col(player,e)){state.lives--;updateHUD();enemies.splice(i,1);i--;if(state.lives<=0){state.run=false;start.textContent='💥 Game Over — touch to restart';return}continue}if(e.x<-60||e.x>W+60||e.y<-60||e.y>H+60){enemies.splice(i,1);i--}}if(Math.random()<0.012)enemies.push(spawn({y0:40,r:18,dy0:1+Math.random()*2,dx0:Math.random()<0.5?-2:2,col:'#ff7f7f'}));draw()}function tryPlay(){music.play().catch(()=>{})}start.addEventListener('click',()=>{if(state.run){state.run=false;return}reset();tryPlay()});addEventListener('keydown',(e)=>{state.keys.add(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',(e)=>state.keys.delete(e.key));function bind(id,key){const el=document.getElementById(id);if(!el)return;const down=(e)=>{e.preventDefault();state.touch[key]=true};const up=(e)=>{e.preventDefault();state.touch[key]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up)}bind('left','left');bind('mid','mid');bind('right','right');engine();function engine(){update();requestAnimationFrame(engine)}</script></body></html>
