name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            kurkarurka/package-lock.json
            jetman-online/package-lock.json
      - run: npm ci && npm run typecheck && npm run build
        working-directory: kurkarurka
      - run: npm ci && npm run typecheck && npm run build
        working-directory: jetman-online
      # Launcher (root index.html) linkuje relatywnie do covers/ i
      # <gra>/dist/ — katalog strony musi odzwierciedlać layout repo.
      - run: |
          mkdir -p site/kurkarurka site/jetman-online
          cp index.html site/
          cp -r covers site/covers
          cp -r kurkarurka/dist site/kurkarurka/dist
          cp -r jetman-online/dist site/jetman-online/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
